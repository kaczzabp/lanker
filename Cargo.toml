[package]
name = "lanker"
version = "0.1.0"
edition = "2021"
description = "High-performance LAN file transfer application"

[dependencies]
eframe = "0.34"
egui = "0.34"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
hostname = "0.4"
directories = "6"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
